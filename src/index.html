<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal Calculator</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="calculator" aria-label="Calculator">
      <output id="display" class="display" aria-live="polite" aria-label="Calculator result">0</output>
      <section class="keypad" aria-label="Calculator controls">
        <button type="button" data-action="clear" class="utility">AC</button>
        <button type="button" data-action="correct" class="utility" aria-label="Correct last digit">⌫</button>
        <button type="button" data-action="sign" class="utility" aria-label="Toggle sign">+/-</button>
        <button type="button" data-action="operator" data-value="/" aria-label="Divide">÷</button>
        <button type="button" data-action="digit" data-value="7">7</button>
        <button type="button" data-action="digit" data-value="8">8</button>
        <button type="button" data-action="digit" data-value="9">9</button>
        <button type="button" data-action="operator" data-value="*" aria-label="Multiply">×</button>
        <button type="button" data-action="digit" data-value="4">4</button>
        <button type="button" data-action="digit" data-value="5">5</button>
        <button type="button" data-action="digit" data-value="6">6</button>
        <button type="button" data-action="operator" data-value="-" aria-label="Subtract">−</button>
        <button type="button" data-action="digit" data-value="1">1</button>
        <button type="button" data-action="digit" data-value="2">2</button>
        <button type="button" data-action="digit" data-value="3">3</button>
        <button type="button" data-action="operator" data-value="+" aria-label="Add">+</button>
        <button type="button" data-action="digit" data-value="0" class="zero">0</button>
        <button type="button" data-action="decimal" aria-label="Decimal point">.</button>
        <button type="button" data-action="equals" class="equals" aria-label="Calculate">=</button>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
